<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxis-Dashboard Klickdummy</title>
<style>
/* Design-Tokens: Platzhalter, durch Werte aus den Dentsply Sirona Brand Guidelines ersetzen */
:root{
  --ds-primary:#0B5FA5;--ds-primary-dark:#07467C;--ds-primary-soft:#E6F0F8;--ds-accent:#00A3AD;
  --ok:#1E7F4F;--watch:#B25E00;--act:#B3261E;
  --bg:#F4F6F8;--surface:#FFFFFF;--text:#1B2430;--text-2:#5A6676;--line:#DDE3EA;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ds-primary:#5AA6E6;--ds-primary-dark:#8CC3F0;--ds-primary-soft:#14304A;--ds-accent:#3CC7CF;--ok:#5CC08C;--watch:#F0A24A;--act:#F08A84;--bg:#0F151C;--surface:#18212B;--text:#E8EDF2;--text-2:#9FACBA;--line:#2A3642;--shadow:0 1px 2px rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--ds-primary:#5AA6E6;--ds-primary-dark:#8CC3F0;--ds-primary-soft:#14304A;--ds-accent:#3CC7CF;--ok:#5CC08C;--watch:#F0A24A;--act:#F08A84;--bg:#0F151C;--surface:#18212B;--text:#E8EDF2;--text-2:#9FACBA;--line:#2A3642;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;display:flex}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ds-accent);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

nav.side{width:232px;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700}
.brand small{display:block;font-weight:500;color:var(--text-2);font-size:12px}
.mark{width:32px;height:32px;border-radius:8px;background:var(--ds-primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
nav.side button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-2);font-weight:600;text-align:left}
nav.side button:hover{background:var(--bg)}
nav.side button[aria-current="page"]{background:var(--ds-primary-soft);color:var(--ds-primary-dark)}
nav.side .cnt{margin-left:auto;background:var(--act);color:#fff;border-radius:9px;font-size:11px;padding:0 7px;line-height:18px}
nav.side .foot{margin-top:auto;font-size:12px;color:var(--text-2);padding:10px}
nav.side .foot a{color:var(--ds-primary);font-weight:700}

main{flex:1;min-width:0;padding:22px 24px 40px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header.top h1{font-size:22px;flex:1}
.search{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:240px;max-width:100%}
.user{display:flex;align-items:center;gap:8px;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ds-accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.muted{color:var(--text-2);font-size:13px}

.layout{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}
.layout>*{min-width:0}
main{overflow-x:hidden}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filters button{padding:6px 12px;border-radius:16px;border:1.5px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.filters button[aria-pressed="true"]{background:var(--ds-primary);border-color:var(--ds-primary);color:#fff}
.plist{padding:6px}
.prow{display:flex;gap:12px;align-items:center;padding:12px 10px;border-radius:10px;width:100%;text-align:left}
.prow:hover{background:var(--bg)}
.prow[aria-current="true"]{background:var(--ds-primary-soft)}
.prow .grow{flex:1;min-width:0}
.prow .reason{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st.watch{color:var(--watch);background:color-mix(in srgb,var(--watch) 14%,transparent)}
.st.act{color:var(--act);background:color-mix(in srgb,var(--act) 12%,transparent)}
.st.act::before{border-radius:2px}
.st.watch::before{border-radius:2px;transform:rotate(45deg)}

.detail h2{font-size:20px}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dhead .grow{flex:1}
.alert{border-left:4px solid var(--act);margin-bottom:14px}
.alert.watch{border-left-color:var(--watch)}
.alert.ok{border-left-color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:700;background:var(--ds-primary);color:#fff;font-size:13px}
.btn.sec{background:var(--ds-primary-soft);color:var(--ds-primary-dark)}
.btn.ghost{border:1.5px solid var(--line);background:var(--surface);color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.sec-t{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-t .grow{flex:1}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph{border-radius:10px;overflow:hidden;position:relative;aspect-ratio:3/2;background:#b5675d}
.ph svg{width:100%;height:100%;display:block}
.ph .lbl{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 6px}
.ph .mk{position:absolute;width:26px;height:26px;border-radius:50%;border:2.5px solid #ffd400;box-shadow:0 0 0 2px rgba(0,0,0,.35);cursor:pointer}
.ph .mk.ok{border-color:var(--ok)} .ph .mk.no{opacity:.25}
.verdict{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.verdict button{padding:8px 12px;border-radius:10px;border:2px solid var(--line);font-weight:700;font-size:13px;background:var(--surface)}
.verdict button[aria-pressed="true"].ok{border-color:var(--ok);color:var(--ok)}
.verdict button[aria-pressed="true"].gap{border-color:var(--watch);color:var(--watch)}
.verdict button[aria-pressed="true"].nt{border-color:var(--act);color:var(--act)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-2)}
.switch input{accent-color:var(--ds-primary);width:16px;height:16px}
.b2{font-size:10px;font-weight:800;background:var(--watch);color:#fff;border-radius:5px;padding:1px 5px}

.bars{display:flex;align-items:flex-end;gap:4px;height:120px;position:relative;margin-top:6px}
.bars .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--ds-accent)}
.bars div.b{flex:1;border-radius:4px 4px 1px 1px;background:var(--ds-primary)}
.bars div.b.low{background:var(--watch)}
.bars div.b.vlow{background:var(--act)}
.xl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:4px}

.events{display:grid;gap:8px}
.ev{display:flex;gap:10px;font-size:13px;align-items:flex-start}
.ev .ic{width:30px;height:30px;border-radius:8px;background:var(--ds-primary-soft);color:var(--ds-primary);display:grid;place-items:center;flex-shrink:0}
.ev .ic svg{width:16px;height:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--text-2);font-size:12px;font-weight:700}
td input,td select{border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);width:80px}
td select{width:auto}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:480px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{font-size:18px;margin-bottom:10px}
.modal textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);min-height:110px;margin:8px 0 12px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;transform:translateY(150%);opacity:0;transition:.3s;z-index:30;max-width:calc(100% - 40px)}
.toast.show{transform:none;opacity:1}

@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  body{display:block}
  nav.side{position:static;width:auto;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  nav.side .brand{padding:4px 8px 4px 0}
  nav.side .brand span:last-child,nav.side .foot{display:none}
  nav.side button{white-space:nowrap}
  main{padding:16px}
  .grid2{grid-template-columns:1fr}
  .photos{gap:6px}
  .ph .lbl{font-size:9px}
  table{display:block;overflow-x:auto}
  .search{width:100%}
}
</style>
</head>
<body>
<nav class="side" aria-label="Hauptnavigation" id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<div id="modal"></div>

<script>
const I={
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c.6-4 3.4-6 7-6s6.4 2 7 6M16 4.5a3.5 3.5 0 010 7M18 14c2 .7 3.5 2.6 4 6"/>',
  bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  send:'<path d="M4 12l16-8-6 16-2-7z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 0c0 1.7-2.5 2-2.5 3.8M12 17h0"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h0"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  tooth:'<path d="M7 3c-3 0-4 3-3.5 6 .5 3 1.5 4 2 7s1 5 2.5 5 1.5-3 2-5 1-2 2-2 1.5 0 2 2 .5 5 2 5 2-2 2.5-5 1.5-4 2-7S20 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  vib:'<rect x="8" y="4" width="8" height="16" rx="3"/><path d="M4 9v6M20 9v6"/>'
};
const ic=(n,a='')=>`<svg class="i" viewBox="0 0 24 24" ${a} aria-hidden="true">${I[n]}</svg>`;
const ST={act:'Handlung nötig',watch:'beobachten',ok:'im Plan'};
const ORDER={act:0,watch:1,ok:2};
const wear=(base,dips)=>Array.from({length:14},(_,k)=>dips[k]??base+((k*7)%5-2)*.3);

let P=[
 {id:1,name:'Lena Muster',age:29,al:7,tot:24,st:'act',reason:'Symptom-Check: „Praxis kontaktieren“ (Passform / Lücke)',icon:'help',since:'vor 12 min',w:wear(22.1,{}),vpro:9,fit:null,gap:true,photoNew:true},
 {id:2,name:'Jonas Becker',age:15,al:12,tot:30,st:'act',reason:'Tragezeit < 18 h an 4 von 7 Tagen',icon:'clock',since:'heute 07:00',w:wear(20,{8:16.5,9:17.2,11:15.9,12:17.5}),vpro:3,fit:'ok',parent:true},
 {id:3,name:'Aylin Demir',age:34,al:4,tot:18,st:'act',reason:'Aligner 4 gebrochen (mit Foto)',icon:'box',since:'gestern 18:40',w:wear(22.3,{}),vpro:10,fit:'ok'},
 {id:4,name:'Marc Hoffmann',age:41,al:19,tot:22,st:'watch',reason:'Passform-Check 3 Tage überfällig',icon:'cam',since:'seit 3 Tagen',w:wear(21.8,{}),vpro:7,fit:'ok'},
 {id:5,name:'Sophie Wagner',age:17,al:9,tot:26,st:'watch',reason:'Wechsel auf Aligner 10 nicht bestätigt',icon:'cal',since:'seit 2 Tagen',w:wear(21.5,{12:19.8}),vpro:8,fit:'ok',parent:true},
 {id:6,name:'Daniel Krüger',age:38,al:15,tot:20,st:'ok',reason:'Alles im Plan · Ø 22:24 h',icon:'check',since:'',w:wear(22.4,{}),vpro:10,fit:'ok'},
 {id:7,name:'Mira Schulz',age:26,al:3,tot:16,st:'ok',reason:'Alles im Plan · Ø 22:05 h',icon:'check',since:'',w:wear(22.1,{}),vpro:9,fit:'ok'},
 {id:8,name:'Tim Neumann',age:31,al:21,tot:28,st:'ok',reason:'Alles im Plan · Ø 22:40 h',icon:'check',since:'',w:wear(22.6,{}),vpro:10,fit:'ok'}
];
let S={view:'patients',filter:'alle',sel:1,assist:false,markers:[{x:44,y:52,s:null},{x:57,y:50,s:null}],audit:{
  1:[['12:41','System','Alarm angelegt: Symptom-Check „Praxis kontaktieren“'],['12:40','Lena Muster','Passform-Check Aligner 7 hochgeladen (3 Fotos)'],['08:02','System','Tragezeit gestern 22:18 h']]}};
const RULES=[
 ['Tragezeit unter Ziel','< 20 h','3 Tage in Folge','watch'],
 ['Tragezeit deutlich unter Ziel','< 18 h','3 von 7 Tagen','act'],
 ['Wechsel nicht bestätigt','2 Tage','nach Plantermin','watch'],
 ['Passform-Foto fehlt','3 Tage','nach Fälligkeit','watch'],
 ['Symptom-Check „Praxis kontaktieren“','sofort','','act'],
 ['Aligner verloren / gebrochen','sofort','','act'],
 ['Passform „trackt nicht“','sofort','','act'],
 ['VPro nicht genutzt','5 Tage','in Folge','watch']];

const cur=()=>P.find(p=>p.id===S.sel);
function audit(t){ (S.audit[S.sel]=S.audit[S.sel]||[]).unshift([new Date().toTimeString().slice(0,5),'Dr. A. Weber',t]); }
let tt; function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),3000);}

function nav(){
  const n=P.filter(p=>p.st==='act').length;
  const items=[['patients','Patient:innen','users',n],['alerts','Alarme','bell',0],['inbox','Nachrichten','chat',0],['stats','Statistik','chart',0],['rules','Alarmregeln','gear',0]];
  document.getElementById('nav').innerHTML=`
   <div class="brand"><span class="mark">DS</span><span>Aligner Companion<small>Praxis-Dashboard</small></span></div>
   ${items.map(([k,l,i,c])=>`<button onclick="S.view='${k==='alerts'?'patients':k}';S.filter='${k==='alerts'?'act':'alle'}';render()" ${S.view===k||(k==='patients'&&S.view==='patients')?'aria-current="page"':''}>${ic(i)}${l}${c?`<span class="cnt">${c}</span>`:''}</button>`).join('')}
   <div class="foot">Kieferorthopädie Dr. Weber<br>Klickdummy v0.2 · <a href="index.html">Patienten-App →</a></div>`;
}

function teeth(gap,plan){
  let s='<rect width="300" height="200" fill="#b5675d"/><path d="M0 70 Q150 30 300 70 L300 0 L0 0Z" fill="#d98c80"/><path d="M0 135 Q150 175 300 135 L300 200 L0 200Z" fill="#d98c80"/>';
  for(let k=0;k<8;k++){
    const x=30+k*30, h=38-Math.abs(k-3.5)*2, y=62+Math.abs(k-3.5)*3, sh=plan?0:(k===3||k===4?3:0);
    s+=`<rect x="${x}" y="${y+sh}" width="26" height="${h}" rx="6" fill="#fbf8f2" stroke="#e6dccd"/>`;
    s+=`<rect x="${x+2}" y="104" width="24" height="${32-Math.abs(k-3.5)*2}" rx="6" fill="#f6f1e8" stroke="#e6dccd"/>`;
    if(!plan){ const g=gap&&(k===3||k===4)?6:1; s+=`<rect x="${x-1}" y="${y+sh+h-1}" width="28" height="${g}" fill="rgba(255,255,255,.35)"/><rect x="${x-1}" y="${y+sh-1}" width="28" height="${h+g}" rx="7" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>`; }
  }
  return `<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice">${s}</svg>`;
}

function patients(){
  const list=P.filter(p=>S.filter==='alle'||p.st===S.filter).sort((a,b)=>ORDER[a.st]-ORDER[b.st]);
  const c=k=>P.filter(p=>p.st===k).length;
  return `
  <header class="top"><h1>Patient:innen</h1><input class="search" placeholder="Name oder Fall-Nr. suchen" aria-label="Suche"><div class="user"><span class="avatar">AW</span>Dr. A. Weber</div></header>
  <div class="kpis">
    <div class="card kpi"><div class="muted">Im Plan</div><div class="v">${Math.round(c('ok')/P.length*100)} %</div><div class="muted">${c('ok')} von ${P.length} Patient:innen</div></div>
    <div class="card kpi"><div class="muted">Handlung nötig</div><div class="v" style="color:var(--act)">${c('act')}</div><div class="muted">${c('watch')} weitere beobachten</div></div>
    <div class="card kpi"><div class="muted">Ø Tragezeit (7 Tage)</div><div class="v">21:52 h</div><div class="muted">Ziel 22:00 h</div></div>
    <div class="card kpi"><div class="muted">Ø Reaktionszeit</div><div class="v">3,2 h</div><div class="muted">Ziel ≤ 1 Arbeitstag</div></div>
  </div>
  <div class="layout">
    <div>
      <div class="filters" role="group" aria-label="Filter">
        ${[['alle','Alle'],['act','Handlung nötig'],['watch','Beobachten'],['ok','Im Plan']].map(([k,l])=>`<button aria-pressed="${S.filter===k}" onclick="S.filter='${k}';render()">${l}${k!=='alle'?` (${c(k)})`:''}</button>`).join('')}
      </div>
      <div class="card plist">
        ${list.map(p=>`<button class="prow" aria-current="${p.id===S.sel}" onclick="S.sel=${p.id};S.markers.forEach(m=>m.s=null);render()">
          <span class="avatar" style="background:${p.st==='act'?'var(--act)':p.st==='watch'?'var(--watch)':'var(--ok)'}">${p.name.split(' ').map(x=>x[0]).join('')}</span>
          <span class="grow"><b>${p.name}</b> <span class="muted">· ${p.age} J. · Aligner ${p.al}/${p.tot}</span><span class="reason muted">${p.reason}</span></span>
          <span class="st ${p.st}">${ST[p.st]}</span></button>`).join('')||'<p class="muted" style="padding:12px">Keine Patient:innen in diesem Filter.</p>'}
      </div>
    </div>
    ${detail()}
  </div>`;
}

function detail(){
  const p=cur(); if(!p) return '<div></div>';
  const mx=24, low=p.w.map(v=>v<18?'vlow':v<20?'low':'');
  const avg=p.w.slice(-7).reduce((a,b)=>a+b,0)/7;
  const fmt=v=>Math.floor(v)+':'+String(Math.round((v%1)*60)).padStart(2,'0');
  const showPhotos=p.photoNew||p.id===1;
  return `<section class="detail">
    <div class="dhead"><span class="avatar" style="width:44px;height:44px;font-size:15px">${p.name.split(' ').map(x=>x[0]).join('')}</span>
      <div class="grow"><h2>${p.name}</h2><div class="muted">${p.age} Jahre · SureSmile® · Aligner ${p.al} von ${p.tot} · Wechsel alle 14 Tage${p.parent?' · Elternansicht aktiv':''}</div></div>
      <span class="st ${p.st}">${ST[p.st]}</span>
      <button class="btn ghost" onclick="toast('PDF für Patientenakte erstellt (Demo)')">${ic('doc')} PDF</button></div>

    <div class="card alert ${p.st}">
      <div class="sec-t">${ic(p.icon)} <span class="grow">${p.st==='ok'?'Kein offener Alarm':'Offener Alarm'}</span><span class="muted" style="text-transform:none;letter-spacing:0">${p.since}</span></div>
      <b style="font-size:15px">${p.reason}</b>
      ${p.id===1&&p.st!=='ok'?`<p class="muted" style="margin-top:6px">Antworten: Lücke „an mehreren Zähnen“ · Chewies „selten oder nie“. Passform-Check (3 Fotos) wurde gleichzeitig hochgeladen.</p>`:''}
      ${p.id===2&&p.st!=='ok'?`<p class="muted" style="margin-top:6px">Tiefpunkte an Schultagen. Elternansicht sieht nur den Tragezeit-Status.</p>`:''}
      ${p.id===3&&p.st!=='ok'?`<p class="muted" style="margin-top:6px">Patientin trägt laut Standardanweisung Aligner 5 (Aligner 4 seit 9 Tagen getragen).</p>`:''}
      <div class="actions">
        <button class="btn" onclick="msg()">${ic('send')} Nachricht</button>
        <button class="btn sec" onclick="act('Neue Fotos angefordert (Passform-Check, 3 Ansichten)','Fotoanforderung gesendet')">${ic('cam')} Fotos anfordern</button>
        <button class="btn sec" onclick="act('Aligner ${p.al} um 7 Tage verlängert','Verlängerung an Patient:in gesendet')">${ic('clock')} Aligner verlängern</button>
        <button class="btn sec" onclick="act('Termin vorgeschlagen: 20.11., 10:30','Terminvorschlag gesendet')">${ic('cal')} Termin</button>
        <button class="btn sec" onclick="act('Ersatz-Aligner ${p.al} bei SureSmile bestellt','Bestellung ausgelöst (Demo)')">${ic('box')} Ersatz bestellen</button>
        ${p.st!=='ok'?`<button class="btn ghost" onclick="resolve()">${ic('check')} Alarm erledigt</button>`:''}
      </div>
    </div>

    ${showPhotos?`<div class="card" style="margin-bottom:14px">
      <div class="sec-t"><span class="grow">Passform-Check Aligner ${p.al} · Frontal</span>
        <label class="switch"><input type="checkbox" ${S.assist?'checked':''} onchange="S.assist=this.checked;render()"> Fit-Assist <span class="b2">B2</span></label></div>
      <div class="photos">
        <div class="ph">${teeth(false,false)}<span class="lbl">Vorher · Aligner ${p.al-1}</span></div>
        <div class="ph">${teeth(p.gap,false)}<span class="lbl">Aktuell · heute</span>
          ${S.assist?S.markers.map((m,i)=>`<button class="mk ${m.s==='ok'?'ok':m.s==='no'?'no':''}" style="left:calc(${m.x}% - 13px);top:calc(${m.y}% - 13px)" title="Mögliche Lücke: bestätigen oder verwerfen" aria-label="Markierung ${i+1}" onclick="mark(${i})"></button>`).join(''):''}</div>
        <div class="ph">${teeth(false,true)}<span class="lbl">Plan · Aligner ${p.al}</span></div>
      </div>
      ${S.assist?`<p class="muted" style="margin-top:8px">Fit-Assist markiert mögliche Lücken an den Schneidekanten. Jede Markierung anklicken: einmal = bestätigen, zweimal = verwerfen. Nur Entscheidungsunterstützung (Stufe B2, nicht Release 1).</p>`:''}
      <div class="verdict"><b style="margin-right:4px">Passform:</b>
        ${[['ok','OK'],['gap','Lücke'],['nt','Trackt nicht']].map(([k,l])=>`<button class="${k}" aria-pressed="${p.fit===k}" onclick="fit('${k}','${l}')">${l}</button>`).join('')}
        <span class="muted" style="margin-left:auto">Ansicht: <b>Frontal</b> · Links · Rechts</span></div>
    </div>`:''}

    <div class="grid2">
      <div class="card"><div class="sec-t"><span class="grow">Tragezeit 14 Tage</span><span style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)">Ø 7 T.: <b>${fmt(avg)} h</b></span></div>
        <div class="bars" role="img" aria-label="Tragezeit der letzten 14 Tage"><div class="goal" style="bottom:${22/mx*100}%"></div>${p.w.map((v,k)=>`<div class="b ${low[k]}" style="height:${v/mx*100}%" title="${fmt(v)} h"></div>`).join('')}</div>
        <div class="xl"><span>30.10.</span><span>Ziel 22 h</span><span>12.11.</span></div></div>
      <div class="card"><div class="sec-t">${ic('vib')} <span class="grow">VPro &amp; Aligner</span></div>
        <div class="events">
          <div class="ev"><span class="ic">${ic('vib')}</span><span><b>VPro an ${p.vpro} von 10 Tagen</b><br><span class="muted">automatisch vom Gerät übertragen</span></span></div>
          <div class="ev"><span class="ic">${ic('tooth')}</span><span><b>Aligner ${p.al} seit 11 Tagen</b><br><span class="muted">Wechsel geplant 16.11.</span></span></div>
          <div class="ev"><span class="ic">${ic('cal')}</span><span><b>Nächster Termin 20.11., 10:30</b><br><span class="muted">Kontrolle, IPR bei Aligner 12</span></span></div>
        </div></div>
    </div>

    <div class="card"><div class="sec-t">${ic('shield')} <span class="grow">Audit-Trail</span><span class="muted" style="text-transform:none;letter-spacing:0">unveränderbar protokolliert</span></div>
      <table><thead><tr><th>Zeit</th><th>Wer</th><th>Was</th></tr></thead><tbody>
      ${(S.audit[p.id]||[['gestern','System','Tragezeit synchronisiert']]).map(([t,w,x])=>`<tr><td>${t}</td><td>${w}</td><td>${x}</td></tr>`).join('')}
      </tbody></table></div>
  </section>`;
}
function act(a,t){ audit(a); toast(t); render(); }
function fit(k,l){ const p=cur(); p.fit=k; audit('Passform bewertet: '+l); if(k==='nt'){p.st='act';p.reason='Passform „trackt nicht“ markiert';} toast('Bewertung gespeichert'); render(); }
function mark(i){ const m=S.markers[i]; m.s=m.s===null?'ok':m.s==='ok'?'no':null; audit('Fit-Assist-Markierung '+(i+1)+': '+(m.s==='ok'?'bestätigt':m.s==='no'?'verworfen':'zurückgesetzt')); render(); }
function resolve(){ const p=cur(); audit('Alarm erledigt: '+p.reason); p.st='ok'; p.reason='Alles im Plan · Alarm erledigt'; p.icon='check'; p.since=''; toast('Alarm erledigt'); render(); }
function msg(){
  const p=cur();
  const tpl=p.id===1?'Hallo Frau Muster, danke für Ihre Fotos. Eine kleine Lücke an den Schneidezähnen ist zu sehen. Bitte nutzen Sie die Chewies 2× täglich für je 5 Minuten und tragen Sie Aligner 7 noch 3 Tage länger. Ihr Praxisteam':'Hallo, wir haben uns Ihre Daten angesehen. ';
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)this.remove()"><div class="modal" role="dialog" aria-label="Nachricht">
    <h3>Nachricht an ${p.name}</h3>
    <select style="border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface)"><option>Vorlage: Passform / Chewies</option><option>Vorlage: Tragezeit-Motivation</option><option>Vorlage: Ersatz unterwegs</option></select>
    <textarea id="mtxt">${tpl}</textarea>
    <p class="muted" style="margin-bottom:12px">Wird Ende-zu-Ende-verschlüsselt zugestellt. Die Patient:in erhält eine Push-Mitteilung ohne Inhalt.</p>
    <div class="actions" style="justify-content:flex-end"><button class="btn ghost" onclick="document.getElementById('modal').innerHTML=''">Abbrechen</button><button class="btn" onclick="audit('Nachricht gesendet: '+document.getElementById('mtxt').value.slice(0,60)+'…');document.getElementById('modal').innerHTML='';toast('Nachricht gesendet');render()">${ic('send')} Senden</button></div>
  </div></div>`;
}

function rules(){
  return `<header class="top"><h1>Alarmregeln</h1><div class="user"><span class="avatar">AW</span>Dr. A. Weber</div></header>
  <div class="card" style="margin-bottom:14px"><div class="sec-t">Regeln dieser Praxis</div>
  <table><thead><tr><th>Regel</th><th>Schwelle</th><th>Zeitraum</th><th>Status</th><th>Aktiv</th></tr></thead><tbody>
  ${RULES.map(([r,s,z,st])=>`<tr><td><b>${r}</b></td><td><input value="${s}" aria-label="Schwelle ${r}"></td><td>${z?`<input value="${z}" style="width:140px" aria-label="Zeitraum ${r}">`:'–'}</td><td><select aria-label="Status ${r}"><option ${st==='watch'?'selected':''}>beobachten</option><option ${st==='act'?'selected':''}>Handlung nötig</option></select></td><td><input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--ds-primary)" aria-label="aktiv"></td></tr>`).join('')}
  </tbody></table></div>
  <div class="grid2">
    <div class="card"><div class="sec-t">Vorgaben für Patient:innen</div>
      <table><tbody>
        <tr><td>Tragezeitziel</td><td><input value="22 h"></td></tr>
        <tr><td>Pausen-Erinnerung (Standard)</td><td><input value="45 min"></td></tr>
        <tr><td>Pausen-Erinnerung (max. erlaubt)</td><td><input value="60 min"></td></tr>
        <tr><td>Passform-Check</td><td><select><option>bei jedem Wechsel</option><option>alle 2 Wechsel</option><option>nur auf Anforderung</option></select></td></tr>
        <tr><td>Foto-Umfang</td><td><select><option>3 Ansichten</option><option>6 Ansichten</option></select></td></tr>
      </tbody></table></div>
    <div class="card"><div class="sec-t">Standardanweisung bei Verlust / Bruch</div>
      <textarea style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);min-height:120px">Wenn der aktuelle Aligner seit mindestens 7 Tagen getragen wird, den nächsten einsetzen, sonst den vorherigen. In jedem Fall weiter einen Aligner tragen.</textarea>
      <p class="muted" style="margin-top:8px">Wird Patient:innen bei einer Meldung sofort angezeigt.</p></div>
  </div>
  <button class="btn" onclick="toast('Regeln gespeichert (Änderung im Audit-Trail)')">Speichern</button>`;
}
function stats(){
  const wk=[[62,71],[65,74],[70,76],[72,80],[75,78],[78,83]];
  return `<header class="top"><h1>Statistik</h1><div class="user"><span class="avatar">AW</span>Dr. A. Weber</div></header>
  <div class="kpis">
    <div class="card kpi"><div class="muted">Tragezeit an ≥ 5 Tagen/Woche erfasst</div><div class="v">78 %</div><div class="muted">Pilotziel ≥ 60 %</div></div>
    <div class="card kpi"><div class="muted">Fotos im Rhythmus</div><div class="v">83 %</div><div class="muted">Pilotziel ≥ 70 %</div></div>
    <div class="card kpi"><div class="muted">Prüfzeit pro Fotoserie</div><div class="v">48 s</div><div class="muted">Ziel ≤ 1 min</div></div>
    <div class="card kpi"><div class="muted">Alarme pro Woche</div><div class="v">11</div><div class="muted">davon 4 „Handlung nötig“</div></div>
  </div>
  <div class="card"><div class="sec-t"><span class="grow">Letzte 6 Wochen</span><span style="text-transform:none;letter-spacing:0;font-size:12px"><span style="color:var(--ds-primary)">■</span> Tragezeit erfasst &nbsp; <span style="color:var(--ds-accent)">■</span> Fotos im Rhythmus</span></div>
    <div style="display:flex;gap:18px;align-items:flex-end;height:160px">
      ${wk.map(([a,b],k)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><div style="display:flex;gap:3px;align-items:flex-end;height:100%;width:100%"><div style="flex:1;height:${a}%;background:var(--ds-primary);border-radius:4px 4px 1px 1px" title="${a} %"></div><div style="flex:1;height:${b}%;background:var(--ds-accent);border-radius:4px 4px 1px 1px" title="${b} %"></div></div><span class="muted" style="font-size:11px">KW${41+k}</span></div>`).join('')}
    </div></div>`;
}
function inbox(){
  return `<header class="top"><h1>Nachrichten</h1><div class="user"><span class="avatar">AW</span>Dr. A. Weber</div></header>
  <div class="card">${[['Lena Muster','Ist das normal? Passform / Lücke','vor 12 min','Team'],['Aylin Demir','Aligner 4 gebrochen','gestern','Dr. Weber'],['Sophie Wagner','Termin verschieben','gestern','Rezeption'],['Jonas Becker','Kurze Frage zu Chewies','Mo.','Team']].map(([n,t,d,z])=>`
    <div class="prow"><span class="avatar">${n.split(' ').map(x=>x[0]).join('')}</span><span class="grow"><b>${n}</b><span class="reason muted">${t}</span></span><span class="muted">${d}</span><select aria-label="zuweisen" style="border:1.5px solid var(--line);border-radius:8px;padding:4px;background:var(--surface)"><option>${z}</option><option>Dr. Weber</option><option>Team</option></select></div>`).join('')}</div>`;
}
function render(){
  nav();
  document.getElementById('main').innerHTML={patients,rules,stats,inbox}[S.view]();
}
render();
</script>
</body>
</html>
