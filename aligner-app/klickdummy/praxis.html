<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Dashboard Prototype</title>
<style>
/* Design tokens: placeholders, replace with values from the Dentsply Sirona brand guidelines */
:root{
  --ds-primary:#0B5FA5;--ds-primary-dark:#07467C;--ds-primary-soft:#E6F0F8;--ds-accent:#00A3AD;
  --ok:#1E7F4F;--watch:#B25E00;--act:#B3261E;
  --bg:#F4F6F8;--surface:#FFFFFF;--text:#1B2430;--text-2:#5A6676;--line:#DDE3EA;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ds-primary:#5AA6E6;--ds-primary-dark:#8CC3F0;--ds-primary-soft:#14304A;--ds-accent:#3CC7CF;--ok:#5CC08C;--watch:#F0A24A;--act:#F08A84;--bg:#0F151C;--surface:#18212B;--text:#E8EDF2;--text-2:#9FACBA;--line:#2A3642;--shadow:0 1px 2px rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--ds-primary:#5AA6E6;--ds-primary-dark:#8CC3F0;--ds-primary-soft:#14304A;--ds-accent:#3CC7CF;--ok:#5CC08C;--watch:#F0A24A;--act:#F08A84;--bg:#0F151C;--surface:#18212B;--text:#E8EDF2;--text-2:#9FACBA;--line:#2A3642;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;display:flex}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ds-accent);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

nav.side{width:232px;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700}
.brand small{display:block;font-weight:500;color:var(--text-2);font-size:12px}
.mark{width:32px;height:32px;border-radius:8px;background:var(--ds-primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
nav.side button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-2);font-weight:600;text-align:left}
nav.side button:hover{background:var(--bg)}
nav.side button[aria-current="page"]{background:var(--ds-primary-soft);color:var(--ds-primary-dark)}
nav.side .cnt{margin-left:auto;background:var(--act);color:#fff;border-radius:9px;font-size:11px;padding:0 7px;line-height:18px}
nav.side .foot{margin-top:auto;font-size:12px;color:var(--text-2);padding:10px}
nav.side .foot a{color:var(--ds-primary);font-weight:700}

main{flex:1;min-width:0;padding:22px 24px 40px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header.top h1{font-size:22px;flex:1}
.search{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:240px;max-width:100%}
.user{display:flex;align-items:center;gap:8px;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ds-accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.muted{color:var(--text-2);font-size:13px}

.layout{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}
.layout>*{min-width:0}
main{overflow-x:hidden}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filters button{padding:6px 12px;border-radius:16px;border:1.5px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.filters button[aria-pressed="true"]{background:var(--ds-primary);border-color:var(--ds-primary);color:#fff}
.plist{padding:6px}
.prow{display:flex;gap:12px;align-items:center;padding:12px 10px;border-radius:10px;width:100%;text-align:left}
.prow:hover{background:var(--bg)}
.prow[aria-current="true"]{background:var(--ds-primary-soft)}
.prow .grow{flex:1;min-width:0}
.prow .reason{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st.watch{color:var(--watch);background:color-mix(in srgb,var(--watch) 14%,transparent)}
.st.act{color:var(--act);background:color-mix(in srgb,var(--act) 12%,transparent)}
.st.act::before{border-radius:2px}
.st.watch::before{border-radius:2px;transform:rotate(45deg)}

.detail h2{font-size:20px}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dhead .grow{flex:1}
.alert{border-left:4px solid var(--act);margin-bottom:14px}
.alert.watch{border-left-color:var(--watch)}
.alert.ok{border-left-color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:700;background:var(--ds-primary);color:#fff;font-size:13px}
.btn.sec{background:var(--ds-primary-soft);color:var(--ds-primary-dark)}
.btn.ghost{border:1.5px solid var(--line);background:var(--surface);color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.sec-t{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-t .grow{flex:1}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph{border-radius:10px;overflow:hidden;position:relative;aspect-ratio:3/2;background:#b5675d}
.ph svg{width:100%;height:100%;display:block}
.ph .lbl{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 6px}
.ph .mk{position:absolute;width:26px;height:26px;border-radius:50%;border:2.5px solid #ffd400;box-shadow:0 0 0 2px rgba(0,0,0,.35);cursor:pointer}
.ph .mk.ok{border-color:var(--ok)} .ph .mk.no{opacity:.25}
.verdict{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.verdict button{padding:8px 12px;border-radius:10px;border:2px solid var(--line);font-weight:700;font-size:13px;background:var(--surface)}
.verdict button[aria-pressed="true"].ok{border-color:var(--ok);color:var(--ok)}
.verdict button[aria-pressed="true"].gap{border-color:var(--watch);color:var(--watch)}
.verdict button[aria-pressed="true"].nt{border-color:var(--act);color:var(--act)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-2)}
.switch input{accent-color:var(--ds-primary);width:16px;height:16px}
.b2{font-size:10px;font-weight:800;background:var(--watch);color:#fff;border-radius:5px;padding:1px 5px}

.bars{display:flex;align-items:flex-end;gap:4px;height:120px;position:relative;margin-top:6px}
.bars .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--ds-accent)}
.bars div.b{flex:1;border-radius:4px 4px 1px 1px;background:var(--ds-primary)}
.bars div.b.low{background:var(--watch)}
.bars div.b.vlow{background:var(--act)}
.xl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:4px}

.events{display:grid;gap:8px}
.ev{display:flex;gap:10px;font-size:13px;align-items:flex-start}
.ev .ic{width:30px;height:30px;border-radius:8px;background:var(--ds-primary-soft);color:var(--ds-primary);display:grid;place-items:center;flex-shrink:0}
.ev .ic svg{width:16px;height:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--text-2);font-size:12px;font-weight:700}
td input,td select{border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);width:80px}
td select{width:auto}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:480px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{font-size:18px;margin-bottom:10px}
.modal textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);min-height:110px;margin:8px 0 12px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;transform:translateY(150%);opacity:0;transition:.3s;z-index:30;max-width:calc(100% - 40px)}
.toast.show{transform:none;opacity:1}

@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  body{display:block}
  nav.side{position:static;width:auto;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  nav.side .brand{padding:4px 8px 4px 0}
  nav.side .brand span:last-child,nav.side .foot{display:none}
  nav.side button{white-space:nowrap}
  main{padding:16px}
  .grid2{grid-template-columns:1fr}
  .photos{gap:6px}
  .ph .lbl{font-size:9px}
  table{display:block;overflow-x:auto}
  .search{width:100%}
}
</style>
</head>
<body>
<nav class="side" aria-label="Hauptnavigation" id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<div id="modal"></div>

<script>
const I={
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c.6-4 3.4-6 7-6s6.4 2 7 6M16 4.5a3.5 3.5 0 010 7M18 14c2 .7 3.5 2.6 4 6"/>',
  bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  send:'<path d="M4 12l16-8-6 16-2-7z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 0c0 1.7-2.5 2-2.5 3.8M12 17h0"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h0"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  tooth:'<path d="M7 3c-3 0-4 3-3.5 6 .5 3 1.5 4 2 7s1 5 2.5 5 1.5-3 2-5 1-2 2-2 1.5 0 2 2 .5 5 2 5 2-2 2.5-5 1.5-4 2-7S20 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  vib:'<rect x="8" y="4" width="8" height="16" rx="3"/><path d="M4 9v6M20 9v6"/>'
};
const ic=(n,a='')=>`<svg class="i" viewBox="0 0 24 24" ${a} aria-hidden="true">${I[n]}</svg>`;
const ST={act:'Action needed',watch:'Watch',ok:'On track'};
const ORDER={act:0,watch:1,ok:2};
const wear=(base,dips)=>Array.from({length:14},(_,k)=>dips[k]??base+((k*7)%5-2)*.3);

let P=[
 {id:1,name:'Lena Muster',age:29,al:7,tot:24,st:'act',reason:'Symptom check: “contact practice” (fit / gap)',icon:'help',since:'12 min ago',w:wear(22.1,{}),vpro:9,fit:null,gap:true,photoNew:true},
 {id:2,name:'Jonas Becker',age:15,al:12,tot:30,st:'act',reason:'Wear time < 18 h on 4 of 7 days',icon:'clock',since:'today 07:00',w:wear(20,{8:16.5,9:17.2,11:15.9,12:17.5}),vpro:3,fit:'ok',parent:true},
 {id:3,name:'Aylin Demir',age:34,al:4,tot:18,st:'act',reason:'Aligner 4 broken (with photo)',icon:'box',since:'yesterday 18:40',w:wear(22.3,{}),vpro:10,fit:'ok'},
 {id:4,name:'Marc Hoffmann',age:41,al:19,tot:22,st:'watch',reason:'Fit check 3 days overdue',icon:'cam',since:'for 3 days',w:wear(21.8,{}),vpro:7,fit:'ok'},
 {id:5,name:'Sophie Wagner',age:17,al:9,tot:26,st:'watch',reason:'Change to aligner 10 not confirmed',icon:'cal',since:'for 2 days',w:wear(21.5,{12:19.8}),vpro:8,fit:'ok',parent:true},
 {id:6,name:'Daniel Krüger',age:38,al:15,tot:20,st:'ok',reason:'All on track · Ø 22:24 h',icon:'check',since:'',w:wear(22.4,{}),vpro:10,fit:'ok'},
 {id:7,name:'Mira Schulz',age:26,al:3,tot:16,st:'ok',reason:'All on track · Ø 22:05 h',icon:'check',since:'',w:wear(22.1,{}),vpro:9,fit:'ok'},
 {id:8,name:'Tim Neumann',age:31,al:21,tot:28,st:'ok',reason:'All on track · Ø 22:40 h',icon:'check',since:'',w:wear(22.6,{}),vpro:10,fit:'ok'}
];
let S={view:'patients',filter:'alle',sel:1,assist:false,markers:[{x:44,y:52,s:null},{x:57,y:50,s:null}],audit:{
  1:[['12:41','System','Alert created: symptom check “contact practice”'],['12:40','Lena Muster','Fit check aligner 7 uploaded (3 photos)'],['08:02','System','Wear time yesterday 22:18 h']]}};
const RULES=[
 ['Wear time below target','< 20 h','3 days in a row','watch'],
 ['Wear time well below target','< 18 h','3 of 7 days','act'],
 ['Tray change not confirmed','2 days','after planned date','watch'],
 ['Fit photo missing','3 days','after due date','watch'],
 ['Symptom check “contact practice”','immediately','','act'],
 ['Aligner lost / broken','immediately','','act'],
 ['Fit “not tracking”','immediately','','act'],
 ['VPro not used','5 days','in a row','watch']];

const cur=()=>P.find(p=>p.id===S.sel);
function audit(t){ (S.audit[S.sel]=S.audit[S.sel]||[]).unshift([new Date().toTimeString().slice(0,5),'Dr. A. Weber',t]); }
let tt; function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),3000);}

function nav(){
  const n=P.filter(p=>p.st==='act').length;
  const items=[['patients','Patients','users',n],['alerts','Alerts','bell',0],['inbox','Messages','chat',0],['stats','Statistics','chart',0],['rules','Alert rules','gear',0]];
  document.getElementById('nav').innerHTML=`
   <div class="brand"><span class="mark">DS</span><span>Aligner Companion<small>Practice dashboard</small></span></div>
   ${items.map(([k,l,i,c])=>`<button onclick="S.view='${k==='alerts'?'patients':k}';S.filter='${k==='alerts'?'act':'alle'}';render()" ${S.view===k||(k==='patients'&&S.view==='patients')?'aria-current="page"':''}>${ic(i)}${l}${c?`<span class="cnt">${c}</span>`:''}</button>`).join('')}
   <div class="foot">Dr. Weber Orthodontics<br>Prototype v0.2 · <a href="index.html">Patient app →</a></div>`;
}

function teeth(gap,plan){
  let s='<rect width="300" height="200" fill="#b5675d"/><path d="M0 70 Q150 30 300 70 L300 0 L0 0Z" fill="#d98c80"/><path d="M0 135 Q150 175 300 135 L300 200 L0 200Z" fill="#d98c80"/>';
  for(let k=0;k<8;k++){
    const x=30+k*30, h=38-Math.abs(k-3.5)*2, y=62+Math.abs(k-3.5)*3, sh=plan?0:(k===3||k===4?3:0);
    s+=`<rect x="${x}" y="${y+sh}" width="26" height="${h}" rx="6" fill="#fbf8f2" stroke="#e6dccd"/>`;
    s+=`<rect x="${x+2}" y="104" width="24" height="${32-Math.abs(k-3.5)*2}" rx="6" fill="#f6f1e8" stroke="#e6dccd"/>`;
    if(!plan){ const g=gap&&(k===3||k===4)?6:1; s+=`<rect x="${x-1}" y="${y+sh+h-1}" width="28" height="${g}" fill="rgba(255,255,255,.35)"/><rect x="${x-1}" y="${y+sh-1}" width="28" height="${h+g}" rx="7" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>`; }
  }
  return `<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice">${s}</svg>`;
}

function patients(){
  const list=P.filter(p=>S.filter==='alle'||p.st===S.filter).sort((a,b)=>ORDER[a.st]-ORDER[b.st]);
  const c=k=>P.filter(p=>p.st===k).length;
  return `
  <header class="top"><h1>Patients</h1><input class="search" placeholder="Search name or case no." aria-label="Search"><div class="user"><span class="avatar">AW</span>Dr. A. Weber</div></header>
  <div class="kpis">
    <div class="card kpi"><div class="muted">On track</div><div class="v">${Math.round(c('ok')/P.length*100)} %</div><div class="muted">${c('ok')} of ${P.length} patients</div></div>
    <div class="card kpi"><div class="muted">Action needed</div><div class="v" style="color:var(--act)">${c('act')}</div><div class="muted">${c('watch')} more to watch</div></div>
    <div class="card kpi"><div class="muted">Ø wear time (7 days)</div><div class="v">21:52 h</div><div class="muted">Target 22:00 h</div></div>
    <div class="card kpi"><div class="muted">Ø response time</div><div class="v">3.2 h</div><div class="muted">Target ≤ 1 working day</div></div>
  </div>
  <div class="layout">
    <div>
      <div class="filters" role="group" aria-label="Filter">
        ${[['alle','All'],['act','Action needed'],['watch','Watch'],['ok','On track']].map(([k,l])=>`<button aria-pressed="${S.filter===k}" onclick="S.filter='${k}';render()">${l}${k!=='alle'?` (${c(k)})`:''}</button>`).join('')}
      </div>
      <div class="card plist">
        ${list.map(p=>`<button class="prow" aria-current="${p.id===S.sel}" onclick="S.sel=${p.id};S.markers.forEach(m=>m.s=null);render()">
          <span class="avatar" style="background:${p.st==='act'?'var(--act)':p.st==='watch'?'var(--watch)':'var(--ok)'}">${p.name.split(' ').map(x=>x[0]).join('')}</span>
          <span class="grow"><b>${p.name}</b> <span class="muted">· ${p.age} y · aligner ${p.al}/${p.tot}</span><span class="reason muted">${p.reason}</span></span>
          <span class="st ${p.st}">${ST[p.st]}</span></button>`).join('')||'<p class="muted" style="padding:12px">No patients in this filter.</p>'}
      </div>
    </div>
    ${detail()}
  </div>`;
}

function detail(){
  const p=cur(); if(!p) return '<div></div>';
  const mx=24, low=p.w.map(v=>v<18?'vlow':v<20?'low':'');
  const avg=p.w.slice(-7).reduce((a,b)=>a+b,0)/7;
  const fmt=v=>Math.floor(v)+':'+String(Math.round((v%1)*60)).padStart(2,'0');
  const showPhotos=p.photoNew||p.id===1;
  return `<section class="detail">
    <div class="dhead"><span class="avatar" style="width:44px;height:44px;font-size:15px">${p.name.split(' ').map(x=>x[0]).join('')}</span>
      <div class="grow"><h2>${p.name}</h2><div class="muted">${p.age} years · SureSmile® · aligner ${p.al} of ${p.tot} · change every 14 days${p.parent?' · parent view active':''}</div></div>
      <span class="st ${p.st}">${ST[p.st]}</span>
      <button class="btn ghost" onclick="toast('PDF for patient record created (demo)')">${ic('doc')} PDF</button></div>

    <div class="card alert ${p.st}">
      <div class="sec-t">${ic(p.icon)} <span class="grow">${p.st==='ok'?'No open alert':'Open alert'}</span><span class="muted" style="text-transform:none;letter-spacing:0">${p.since}</span></div>
      <b style="font-size:15px">${p.reason}</b>
      ${p.id===1&&p.st!=='ok'?`<p class="muted" style="margin-top:6px">Answers: gap “on several teeth” · chewies “rarely or never”. Fit check (3 photos) uploaded at the same time.</p>`:''}
      ${p.id===2&&p.st!=='ok'?`<p class="muted" style="margin-top:6px">Dips on school days. Parent view sees wear-time status only.</p>`:''}
      ${p.id===3&&p.st!=='ok'?`<p class="muted" style="margin-top:6px">Following the standing instruction, patient now wears aligner 5 (aligner 4 worn for 9 days).</p>`:''}
      <div class="actions">
        <button class="btn" onclick="msg()">${ic('send')} Message</button>
        <button class="btn sec" onclick="act('New photos requested (fit check, 3 views)','Photo request sent')">${ic('cam')} Request photos</button>
        <button class="btn sec" onclick="act('Aligner ${p.al} extended by 7 days','Extension sent to patient')">${ic('clock')} Extend aligner</button>
        <button class="btn sec" onclick="act('Appointment proposed: Nov 20, 10:30','Appointment proposal sent')">${ic('cal')} Appointment</button>
        <button class="btn sec" onclick="act('Replacement aligner ${p.al} ordered from SureSmile','Order placed (demo)')">${ic('box')} Order replacement</button>
        ${p.st!=='ok'?`<button class="btn ghost" onclick="resolve()">${ic('check')} Resolve alert</button>`:''}
      </div>
    </div>

    ${showPhotos?`<div class="card" style="margin-bottom:14px">
      <div class="sec-t"><span class="grow">Fit check aligner ${p.al} · front</span>
        <label class="switch"><input type="checkbox" ${S.assist?'checked':''} onchange="S.assist=this.checked;render()"> Fit assist <span class="b2">B2</span></label></div>
      <div class="photos">
        <div class="ph">${teeth(false,false)}<span class="lbl">Before · aligner ${p.al-1}</span></div>
        <div class="ph">${teeth(p.gap,false)}<span class="lbl">Current · today</span>
          ${S.assist?S.markers.map((m,i)=>`<button class="mk ${m.s==='ok'?'ok':m.s==='no'?'no':''}" style="left:calc(${m.x}% - 13px);top:calc(${m.y}% - 13px)" title="Possible gap: confirm or reject" aria-label="Marker ${i+1}" onclick="mark(${i})"></button>`).join(''):''}</div>
        <div class="ph">${teeth(false,true)}<span class="lbl">Plan · aligner ${p.al}</span></div>
      </div>
      ${S.assist?`<p class="muted" style="margin-top:8px">Fit assist highlights possible gaps at the incisal edges. Click each marker: once = confirm, twice = reject. Decision support only (scope B2, not release 1).</p>`:''}
      <div class="verdict"><b style="margin-right:4px">Fit:</b>
        ${[['ok','OK'],['gap','Gap'],['nt','Not tracking']].map(([k,l])=>`<button class="${k}" aria-pressed="${p.fit===k}" onclick="fit('${k}','${l}')">${l}</button>`).join('')}
        <span class="muted" style="margin-left:auto">View: <b>Front</b> · Left · Right</span></div>
    </div>`:''}

    <div class="grid2">
      <div class="card"><div class="sec-t"><span class="grow">Wear time, 14 days</span><span style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)">Ø 7 d: <b>${fmt(avg)} h</b></span></div>
        <div class="bars" role="img" aria-label="Wear time over the last 14 days"><div class="goal" style="bottom:${22/mx*100}%"></div>${p.w.map((v,k)=>`<div class="b ${low[k]}" style="height:${v/mx*100}%" title="${fmt(v)} h"></div>`).join('')}</div>
        <div class="xl"><span>Oct 30</span><span>Target 22 h</span><span>Nov 12</span></div></div>
      <div class="card"><div class="sec-t">${ic('vib')} <span class="grow">VPro &amp; aligners</span></div>
        <div class="events">
          <div class="ev"><span class="ic">${ic('vib')}</span><span><b>VPro on ${p.vpro} of 10 days</b><br><span class="muted">transferred automatically from the device</span></span></div>
          <div class="ev"><span class="ic">${ic('tooth')}</span><span><b>Aligner ${p.al} for 11 days</b><br><span class="muted">change planned Nov 16</span></span></div>
          <div class="ev"><span class="ic">${ic('cal')}</span><span><b>Next appointment Nov 20, 10:30</b><br><span class="muted">check-up, IPR at aligner 12</span></span></div>
        </div></div>
    </div>

    <div class="card"><div class="sec-t">${ic('shield')} <span class="grow">Audit trail</span><span class="muted" style="text-transform:none;letter-spacing:0">tamper-proof log</span></div>
      <table><thead><tr><th>Time</th><th>Who</th><th>What</th></tr></thead><tbody>
      ${(S.audit[p.id]||[['yesterday','System','Wear time synced']]).map(([t,w,x])=>`<tr><td>${t}</td><td>${w}</td><td>${x}</td></tr>`).join('')}
      </tbody></table></div>
  </section>`;
}
function act(a,t){ audit(a); toast(t); render(); }
function fit(k,l){ const p=cur(); p.fit=k; audit('Fit rated: '+l); if(k==='nt'){p.st='act';p.reason='Fit marked “not tracking”';} toast('Rating saved'); render(); }
function mark(i){ const m=S.markers[i]; m.s=m.s===null?'ok':m.s==='ok'?'no':null; audit('Fit assist marker '+(i+1)+': '+(m.s==='ok'?'confirmed':m.s==='no'?'rejected':'reset')); render(); }
function resolve(){ const p=cur(); audit('Alert resolved: '+p.reason); p.st='ok'; p.reason='All on track · alert resolved'; p.icon='check'; p.since=''; toast('Alert resolved'); render(); }
function msg(){
  const p=cur();
  const tpl=p.id===1?'Hello Lena, thank you for your photos. We can see a small gap at your front teeth. Please use your chewies twice a day for 5 minutes each and wear aligner 7 for 3 more days. Your practice team':'Hello, we have reviewed your data. ';
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)this.remove()"><div class="modal" role="dialog" aria-label="Message">
    <h3>Message to ${p.name}</h3>
    <select style="border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface)"><option>Template: fit / chewies</option><option>Template: wear-time encouragement</option><option>Template: replacement on its way</option></select>
    <textarea id="mtxt">${tpl}</textarea>
    <p class="muted" style="margin-bottom:12px">Delivered end-to-end encrypted. The patient gets a push notification without content.</p>
    <div class="actions" style="justify-content:flex-end"><button class="btn ghost" onclick="document.getElementById('modal').innerHTML=''">Cancel</button><button class="btn" onclick="audit('Message sent: '+document.getElementById('mtxt').value.slice(0,60)+'…');document.getElementById('modal').innerHTML='';toast('Message sent');render()">${ic('send')} Send</button></div>
  </div></div>`;
}

function rules(){
  return `<header class="top"><h1>Alert rules</h1><div class="user"><span class="avatar">AW</span>Dr. A. Weber</div></header>
  <div class="card" style="margin-bottom:14px"><div class="sec-t">Rules for this practice</div>
  <table><thead><tr><th>Rule</th><th>Threshold</th><th>Period</th><th>Status</th><th>Active</th></tr></thead><tbody>
  ${RULES.map(([r,s,z,st])=>`<tr><td><b>${r}</b></td><td><input value="${s}" aria-label="Threshold ${r}"></td><td>${z?`<input value="${z}" style="width:140px" aria-label="Period ${r}">`:'–'}</td><td><select aria-label="Status ${r}"><option ${st==='watch'?'selected':''}>Watch</option><option ${st==='act'?'selected':''}>Action needed</option></select></td><td><input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--ds-primary)" aria-label="active"></td></tr>`).join('')}
  </tbody></table></div>
  <div class="grid2">
    <div class="card"><div class="sec-t">Patient settings</div>
      <table><tbody>
        <tr><td>Wear-time target</td><td><input value="22 h"></td></tr>
        <tr><td>Break reminder (default)</td><td><input value="45 min"></td></tr>
        <tr><td>Break reminder (max. allowed)</td><td><input value="60 min"></td></tr>
        <tr><td>Fit check</td><td><select><option>every tray change</option><option>every 2nd change</option><option>on request only</option></select></td></tr>
        <tr><td>Photo set</td><td><select><option>3 views</option><option>6 views</option></select></td></tr>
      </tbody></table></div>
    <div class="card"><div class="sec-t">Standing instruction for lost / broken aligners</div>
      <textarea style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);min-height:120px">If the current aligner has been worn for at least 7 days, move on to the next one; otherwise go back to the previous one. Always keep wearing an aligner.</textarea>
      <p class="muted" style="margin-top:8px">Shown to patients immediately when they report a problem.</p></div>
  </div>
  <button class="btn" onclick="toast('Rules saved (change logged in audit trail)')">Save</button>`;
}
function stats(){
  const wk=[[62,71],[65,74],[70,76],[72,80],[75,78],[78,83]];
  return `<header class="top"><h1>Statistics</h1><div class="user"><span class="avatar">AW</span>Dr. A. Weber</div></header>
  <div class="kpis">
    <div class="card kpi"><div class="muted">Wear time logged ≥ 5 days/week</div><div class="v">78 %</div><div class="muted">Pilot target ≥ 60 %</div></div>
    <div class="card kpi"><div class="muted">Photos at requested cadence</div><div class="v">83 %</div><div class="muted">Pilot target ≥ 70 %</div></div>
    <div class="card kpi"><div class="muted">Review time per photo set</div><div class="v">48 s</div><div class="muted">Target ≤ 1 min</div></div>
    <div class="card kpi"><div class="muted">Alerts per week</div><div class="v">11</div><div class="muted">4 of them “action needed”</div></div>
  </div>
  <div class="card"><div class="sec-t"><span class="grow">Last 6 weeks</span><span style="text-transform:none;letter-spacing:0;font-size:12px"><span style="color:var(--ds-primary)">■</span> Wear time logged &nbsp; <span style="color:var(--ds-accent)">■</span> Photos at cadence</span></div>
    <div style="display:flex;gap:18px;align-items:flex-end;height:160px">
      ${wk.map(([a,b],k)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><div style="display:flex;gap:3px;align-items:flex-end;height:100%;width:100%"><div style="flex:1;height:${a}%;background:var(--ds-primary);border-radius:4px 4px 1px 1px" title="${a} %"></div><div style="flex:1;height:${b}%;background:var(--ds-accent);border-radius:4px 4px 1px 1px" title="${b} %"></div></div><span class="muted" style="font-size:11px">W${41+k}</span></div>`).join('')}
    </div></div>`;
}
function inbox(){
  return `<header class="top"><h1>Messages</h1><div class="user"><span class="avatar">AW</span>Dr. A. Weber</div></header>
  <div class="card">${[['Lena Muster','Is this normal? Fit / gap','12 min ago','Team'],['Aylin Demir','Aligner 4 broken','yesterday','Dr. Weber'],['Sophie Wagner','Reschedule appointment','yesterday','Front desk'],['Jonas Becker','Quick question about chewies','Mon','Team']].map(([n,t,d,z])=>`
    <div class="prow"><span class="avatar">${n.split(' ').map(x=>x[0]).join('')}</span><span class="grow"><b>${n}</b><span class="reason muted">${t}</span></span><span class="muted">${d}</span><select aria-label="assign" style="border:1.5px solid var(--line);border-radius:8px;padding:4px;background:var(--surface)"><option>${z}</option><option>Dr. Weber</option><option>Team</option></select></div>`).join('')}</div>`;
}
function render(){
  nav();
  document.getElementById('main').innerHTML={patients,rules,stats,inbox}[S.view]();
}
render();
</script>
</body>
</html>
